<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>

<body>

    <h1>Lịch họp công ty</h1>

    <table border="1">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <!-- Thứ Hai có 2 cuộc họp -->
        <tr>
            <td rowspan="2">Thứ Hai<br>29/09/2026</td>
            <td>08:00 - 09:00</td>
            <td>Họp giao ban đầu tuần</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng Kinh doanh</td>
        </tr>

        <!-- Thứ Ba có cuộc họp kéo dài nhiều giờ -->
        <tr>
            <td>Thứ Ba<br>30/09/2026</td>
            <td>08:00 - 12:00</td>
            <td>Họp tổng kết quý</td>
        </tr>

        <!-- Thứ Tư có 2 cuộc họp -->
        <tr>
            <td rowspan="2">Thứ Tư<br>01/10/2026</td>
            <td>09:00 - 10:00</td>
            <td>Họp phòng Nhân sự</td>
        </tr>

        <tr>
            <td>15:00 - 16:00</td>
            <td>Đánh giá tiến độ dự án</td>
        </tr>

    </table>

</body>
</html>
