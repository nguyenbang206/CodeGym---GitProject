<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Column Start Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>1. Giá trị auto (Sắp xếp mặc định)</h2>
    <div class="grid-container example-auto">
        <div class="item1">Item 1 (auto)</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

    <h2>2. Giá trị span n (grid-column-start: span 2)</h2>
    <div class="grid-container example-span">
        <div class="item1">Item 1 (span 2)</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

    <h2>3. Giá trị column-line (grid-column-start: 2)</h2>
    <div class="grid-container example-line">
        <div class="item1">Item 1 (bắt đầu đường kẻ 2)</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
    </div>

</body>
</html>
