<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Row Gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>1. Giá trị Length (grid-row-gap: 20px)</h2>
    <div class="grid-container example-length">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>2. Giá trị Percentage (grid-row-gap: 5%)</h2>
    <div class="grid-container example-percent">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>3. Giá trị Global (grid-row-gap: initial)</h2>
    <div class="grid-container example-global">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

</body>
</html>
