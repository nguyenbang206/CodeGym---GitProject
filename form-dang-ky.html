<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Đăng ký người dùng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            width: 400px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #2196F3;
            color: white;
        }

        input[type="reset"] {
            background-color: #777;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Đăng ký người dùng</h2>

    <form action="http://demo.codegym.vn/6/registration_form/register.php"
          method="POST">

        <div class="form-group">
            <label for="name">Họ và tên:</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Nhập họ và tên">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Nhập email">
        </div>

        <div class="form-group">
            <label for="phone">Số điện thoại:</label>
            <input type="text"
                   id="phone"
                   name="phone"
                   placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label>Giới tính:</label>

            <div class="gender">
                <label>
                    <input type="radio"
                           name="gender"
                           value="Nam">
                    Nam
                </label>

                <label>
                    <input type="radio"
                           name="gender"
                           value="Nữ">
                    Nữ
                </label>
            </div>
        </div>

        <div class="button-group">
            <input type="submit" value="Đăng ký">
            <input type="reset" value="Nhập lại">
        </div>

    </form>

</body>
</html>
