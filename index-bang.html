<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực hành Định kiểu Bảng với CSS</title>
  <link rel="stylesheet" href="style-bang.css">
</head>
<body>

  <h1>Bài thực hành: Định kiểu Bảng (CSS Table)</h1>

  <section class="table-container">
    <h2>Bảng Danh sách Học viên</h2>
    <table class="styled-table">
      <thead>
        <tr>
          <th>Họ tên</th>
          <th>Tuổi</th>
          <th>Lớp</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Nguyễn Văn A</td>
          <td>20</td>
          <td>Web</td>
        </tr>
        <tr>
          <td>Trần Thị B</td>
          <td>21</td>
          <td>Web</td>
        </tr>
        <tr>
          <td>Lê Văn C</td>
          <td>22</td>
          <td>Mobile</td>
        </tr>
      </tbody>
    </table>
  </section>

</body>
</html>
