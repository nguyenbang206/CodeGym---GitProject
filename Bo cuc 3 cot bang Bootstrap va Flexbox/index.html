<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 3 Cột - Bootstrap Grid & Flexbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-home me-2"></i>Trang chủ
            </a>
            <button class="btn btn-primary">
                <i class="fas fa-paper-plane me-1"></i> Gửi
            </button>
        </div>
    </nav>

    <div class="container my-5 py-3 border-bottom">
        <h3 class="text-center fw-bold">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <div class="container">
        <div class="d-none d-md-block bg-warning text-center p-3 mb-4 rounded-3 fw-bold">
            <p class="mb-0"><i class="fas fa-info-circle me-2"></i>Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px</p>
        </div>

        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border rounded-3 text-center min-vh-25">
                <p class="h5 mb-0 fw-bold"><i class="fas fa-cubes text-primary me-2"></i>Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-4 text-white rounded-3 text-center min-vh-25">
                <p class="h5 mb-0 fw-bold"><i class="fas fa-layer-group me-2"></i>Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border rounded-3 text-center min-vh-25">
                <p class="h5 mb-0 fw-bold"><i class="fas fa-boxes-stacked text-primary me-2"></i>Phần 3</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="myCarousel" class="carousel slide mt-5 shadow-sm rounded-3 overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="fw-bold mb-4 text-center text-primary"><i class="fas fa-envelope me-2"></i>Liên Hệ Với Chúng Tôi</h4>
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label font-weight-bold">Họ và tên</label>
                                <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">Nội dung</label>
                                <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung" required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-paper-plane me-2"></i> Gửi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 CodeGym. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
