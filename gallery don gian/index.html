<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="gallery-title">Bộ Sưu Tập Ảnh Responsive</h1>

    <div class="gallery">
        <div class="responsive">
            <div class="img-box">
                <img src="https://picsum.photos/600/400?random=1" alt="Ảnh 1">
                <div class="desc">Mô tả ảnh 1</div>
            </div>
        </div>

        <div class="responsive">
            <div class="img-box">
                <img src="https://picsum.photos/600/400?random=2" alt="Ảnh 2">
                <div class="desc">Mô tả ảnh 2</div>
            </div>
        </div>

        <div class="responsive">
            <div class="img-box">
                <img src="https://picsum.photos/600/400?random=3" alt="Ảnh 3">
                <div class="desc">Mô tả ảnh 3</div>
            </div>
        </div>

        <div class="responsive">
            <div class="img-box">
                <img src="https://picsum.photos/600/400?random=4" alt="Ảnh 4">
                <div class="desc">Mô tả ảnh 4</div>
            </div>
        </div>
    </div>

</body>
</html>
