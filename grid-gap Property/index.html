<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h2>
    <div class="grid-container example-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
    <div class="grid-container example-2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
